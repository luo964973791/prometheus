global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node"
    static_configs:
      - targets:
          - "172.27.0.6:9100"

  - job_name: "kafka_exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: "elasticsearch_exporter"
    static_configs:
      - targets: ["elasticsearch-exporter:9200"]

  - job_name: "mysql_exporter"
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: "nginx_exporter"
    static_configs:
      - targets: ["nginx-exporter:9106"]

  - job_name: "redis_exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]